# Optional. Install only with the server admin's existing SSH approval.
# This tightens one account. It does not open SSH, disable authentication, or change other users.
Match User grok-wechat
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    AllowTcpForwarding no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PermitUserRC no
    ForceCommand /usr/bin/node /var/lib/grok-wechat/app/bridge/reply-remote.mjs
